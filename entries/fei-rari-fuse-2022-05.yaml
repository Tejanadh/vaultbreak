root_cause: In the Compound-style ETH market, native ETH was paid out with a value-carrying call before
  the market had finished its own bookkeeping. A reentrancy fix applied earlier in the year did not cover
  exitMarket, so a contract receiving the ETH could call back in, withdraw flash-loaned collateral and
  still leave its debt standing.
preconditions:
- native_eth_market
- external_call_before_state_update
- prior_fix_not_applied_to_all_entrypoints
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Rari/Compound source)
    pragma solidity ^0.8.20;
    contract VulnerablePool {
        mapping(address => uint256) public collateral;
        mapping(address => uint256) public debt;
        function withdraw(uint256 amount) external {
            require(collateral[msg.sender] >= amount, "insufficient");
            require(collateral[msg.sender] - amount >= debt[msg.sender] * 2, "undercollateralised");
            (bool ok, ) = msg.sender.call{value: amount}("");   // interaction first
            require(ok, "send failed");
            collateral[msg.sender] -= amount;                    // effect last
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Rari/Compound source)
    pragma solidity ^0.8.20;
    contract SaferPool {
        mapping(address => uint256) public collateral;
        mapping(address => uint256) public debt;
        function withdraw(uint256 amount) external {
            require(collateral[msg.sender] >= amount, "insufficient");
            require(collateral[msg.sender] - amount >= debt[msg.sender] * 2, "undercollateralised");
            collateral[msg.sender] -= amount;                    // effect first
            (bool ok, ) = msg.sender.call{value: amount}("");   // interaction last
            require(ok, "send failed");
        }
    }
  explanation: 'Classic checks-effects-interactions ordering, but the lesson is the incomplete fix: every
    entry point that can pay out ETH (here exitMarket as well as withdraw paths) needs the same protection,
    ideally a shared mutex.'

scope: code
vuln_class: oracle_manipulation
tags:
- spot_price_input
- low_liquidity_state
root_cause: Solend priced USDH from a Switchboard feed that read one Saber pool. Ackee says an attempt
  on 28 October was arbitraged in the same slot, so the oracle never stored the pumped price. On
  2 November the same buy was followed by transactions that write-locked the pool account, the oracle
  stored the high price, and USDH deposited as collateral borrowed the Stable, Coin98, and Kamino pools.
preconditions:
- single_pool_oracle
- oracle_update_can_land_on_a_moved_price
affected_contracts: []
attack_txs: []
code_pattern:
  language: rust
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Solend source)
    fn collateral_usd(pool_price: u64, amount: u64) -> u64 {
        pool_price * amount
    }
  fixed_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Solend source)
    fn collateral_usd(oracle_a: u64, oracle_b: u64, amount: u64) -> u64 {
        let price = oracle_a.min(oracle_b);
        price * amount
    }
  explanation: A lending price that has only one thin pool as input can be moved for the slot the
    oracle samples. A second independent price, with the lower one used, is the illustration here.
    It is not a claim about Solend's later oracle.

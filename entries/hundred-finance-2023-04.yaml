root_cause: A market with almost no shares in circulation derives its exchange rate from the underlying
  balance it holds. The attacker donated WBTC straight to the empty hWBTC market, which blew up the rate,
  and then a rounding error in redeemUnderlying let them take out more than they were owed while burning
  too few shares.
preconditions:
- market_with_near_zero_total_shares
- exchange_rate_from_raw_token_balance
- redeem_rounds_in_users_favour

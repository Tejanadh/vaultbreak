code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Hundred/Compound source)
    pragma solidity ^0.8.20;
    interface IERC20 { function balanceOf(address) external view returns (uint256); function transfer(address, uint256) external returns (bool); }
    contract VulnerableMarket {
        IERC20 public underlying;
        uint256 public totalShares;
        mapping(address => uint256) public shares;
        function exchangeRate() public view returns (uint256) {
            if (totalShares == 0) return 1e18;
            return underlying.balanceOf(address(this)) * 1e18 / totalShares;   // anyone can donate to move this
        }
        function redeemUnderlying(uint256 amount) external {
            uint256 burn = amount * 1e18 / exchangeRate();                     // rounds down: too few shares burned
            shares[msg.sender] -= burn;
            totalShares -= burn;
            underlying.transfer(msg.sender, amount);
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Hundred/Compound source)
    pragma solidity ^0.8.20;
    interface IERC20 { function balanceOf(address) external view returns (uint256); function transfer(address, uint256) external returns (bool); }
    contract SaferMarket {
        IERC20 public underlying;
        uint256 public totalShares;
        uint256 public trackedCash;                 // internal accounting, ignores raw donations
        mapping(address => uint256) public shares;
        // Market creation must seed shares to a dead address so totalShares is never near zero.
        function exchangeRate() public view returns (uint256) {
            if (totalShares == 0) return 1e18;
            return trackedCash * 1e18 / totalShares;
        }
        function redeemUnderlying(uint256 amount) external {
            uint256 rate = exchangeRate();
            uint256 burn = (amount * 1e18 + rate - 1) / rate;   // round UP in the protocol's favour
            shares[msg.sender] -= burn;
            totalShares -= burn;
            trackedCash -= amount;
            underlying.transfer(msg.sender, amount);
        }
    }
  explanation: 'Three layers: seed new markets so they are never empty, account for cash internally instead
    of reading raw balances, and always round share burns up / share mints down.'

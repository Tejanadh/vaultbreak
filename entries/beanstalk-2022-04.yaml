code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Beanstalk's source)
    pragma solidity ^0.8.20;
    interface IToken { function balanceOf(address) external view returns (uint256); function totalSupply() external view returns (uint256); }
    contract VulnerableGov {
        IToken public token;
        struct Proposal { address target; bytes data; bool executed; }
        mapping(uint256 => Proposal) public proposals;
        // Power is read from *current* balances, so it can be borrowed for one tx,
        // and the emergency path has no delay.
        function emergencyExecute(uint256 id) external {
            require(token.balanceOf(msg.sender) * 3 >= token.totalSupply() * 2, "no supermajority");
            Proposal storage p = proposals[id];
            require(!p.executed, "done");
            p.executed = true;
            (bool ok, ) = p.target.call(p.data);
            require(ok, "call failed");
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Beanstalk's source)
    pragma solidity ^0.8.20;
    interface IVotes { function getPastVotes(address, uint256) external view returns (uint256); function getPastTotalSupply(uint256) external view returns (uint256); }
    contract SaferGov {
        IVotes public token;
        uint256 public constant DELAY = 2 days;
        struct Proposal { address target; bytes data; bool executed; uint256 snapshotBlock; uint256 queuedAt; }
        mapping(uint256 => Proposal) public proposals;
        function execute(uint256 id) external {
            Proposal storage p = proposals[id];
            require(block.timestamp >= p.queuedAt + DELAY, "timelock");
            require(token.getPastVotes(msg.sender, p.snapshotBlock) * 3 >= token.getPastTotalSupply(p.snapshotBlock) * 2, "no supermajority");
            require(!p.executed, "done");
            p.executed = true;
            (bool ok, ) = p.target.call(p.data);
            require(ok, "call failed");
        }
    }
  explanation: Snapshot voting power at a block before the proposal exists (so borrowed funds do not count)
    and force a delay between passing and executing, including on any 'emergency' route.

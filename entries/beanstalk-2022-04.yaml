root_cause: Voting weight could be acquired inside a single transaction with borrowed funds, and an emergency
  path let a passed proposal execute with no waiting period. The attacker therefore borrowed enough to
  carry the vote, passed a proposal they had written themselves, and had it move treasury assets in the
  same transaction before anyone could react.

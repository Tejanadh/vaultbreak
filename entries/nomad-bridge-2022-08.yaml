root_cause: After a routine upgrade, the message-replica contract was initialised with the all-zero value
  marked as an already-confirmed root. Any message that nobody had proven maps to that zero root by default,
  so every message looked valid and process() could be called directly. The exploit transaction was trivially
  copyable, so many unrelated accounts repeated it.

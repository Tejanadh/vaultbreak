code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Nomad's source)
    pragma solidity ^0.8.20;
    contract VulnerableReplica {
        mapping(bytes32 => uint256) public confirmAt;      // root => time it becomes valid
        mapping(bytes32 => bytes32) public provenUnderRoot; // message hash => root (default 0x00)
        mapping(bytes32 => bool) public processed;
        function initialize(bytes32 committedRoot) external {
            confirmAt[committedRoot] = 1;                   // deployed with bytes32(0)
        }
        function process(bytes calldata message) external {
            bytes32 h = keccak256(message);
            require(!processed[h], "already processed");
            bytes32 root = provenUnderRoot[h];              // 0x00 for any unproven message
            require(confirmAt[root] != 0 && block.timestamp >= confirmAt[root], "not proven");
            processed[h] = true;
            // ... release funds described by `message`
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Nomad's source)
    pragma solidity ^0.8.20;
    contract SaferReplica {
        mapping(bytes32 => uint256) public confirmAt;
        mapping(bytes32 => bytes32) public provenUnderRoot;
        mapping(bytes32 => bool) public processed;
        bool private initialized;
        function initialize(bytes32 committedRoot) external {
            require(!initialized, "already initialised");
            require(committedRoot != bytes32(0), "zero root");
            initialized = true;
            confirmAt[committedRoot] = 1;
        }
        function process(bytes calldata message) external {
            bytes32 h = keccak256(message);
            require(!processed[h], "already processed");
            bytes32 root = provenUnderRoot[h];
            require(root != bytes32(0), "unproven message");
            require(confirmAt[root] != 0 && block.timestamp >= confirmAt[root], "not proven");
            processed[h] = true;
        }
    }
  explanation: Sentinel defaults must never be members of the trusted set. Reject the zero root at initialisation,
    reject unproven messages explicitly in process(), and test post-upgrade state in the upgrade runbook.

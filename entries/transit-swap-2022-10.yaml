root_cause: The router's claimTokens path issued a transferFrom whose token address and parameters came
  from the caller instead of being fixed by the protocol. Because users had approved the router, an attacker
  could point it at any approving victim and move their tokens. The contracts were unverified, so the
  analysis relied on decompilation by SlowMist (via Rekt).
preconditions:
- users_hold_standing_approvals_to_router
- token_and_source_address_are_call_arguments
- unverified_source_code
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Transit Swap's source)
    pragma solidity ^0.8.20;
    interface IERC20 { function transferFrom(address from, address to, uint256 amount) external returns (bool); }
    contract VulnerableRouter {
        // `token`, `from` and `to` all come from the caller. Anyone who approved
        // this router can have tokens moved to an address of the caller's choice.
        function claimTokens(address token, address from, address to, uint256 amount) external {
            IERC20(token).transferFrom(from, to, amount);
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Transit Swap's source)
    pragma solidity ^0.8.20;
    interface IERC20 { function transferFrom(address from, address to, uint256 amount) external returns (bool); }
    contract SaferRouter {
        mapping(address => bool) public allowedToken;
        // Tokens only ever come from the caller, and the token must be allowlisted.
        function deposit(address token, address to, uint256 amount) external {
            require(allowedToken[token], "token not allowed");
            IERC20(token).transferFrom(msg.sender, to, amount);
        }
    }
  explanation: Never let a caller choose whose funds are pulled. The pull source is msg.sender, the token
    is allowlisted, and external calls built from arguments are avoided or constrained.

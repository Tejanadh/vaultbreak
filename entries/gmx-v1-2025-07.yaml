root_cause: Order execution allowed the account for a decrease order to be a contract, and called back
  into it through a position-callback hook while the protocol's global accounting was mid-update. From
  that callback the attacker manipulated the globally tracked average short price, which fed the pool-token
  price calculation, inflating the value of the liquidity token they then redeemed.

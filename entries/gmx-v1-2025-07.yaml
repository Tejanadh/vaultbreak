code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not GMX's source)
    pragma solidity ^0.8.20;
    interface ICallback { function onDecrease(uint256 size) external; }
    contract VulnerablePerps {
        uint256 public globalShortSize;
        uint256 public globalShortAveragePrice;
        // External call into a user-supplied contract before global accounting is finished.
        function executeDecrease(address account, uint256 size) external {
            if (account.code.length > 0) ICallback(account).onDecrease(size);
            globalShortSize -= size;
        }
        // Reachable from inside the callback while the numbers above are stale.
        function increaseShort(uint256 size, uint256 price) external {
            uint256 newSize = globalShortSize + size;
            globalShortAveragePrice = (globalShortAveragePrice * globalShortSize + price * size) / newSize;
            globalShortSize = newSize;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not GMX's source)
    pragma solidity ^0.8.20;
    contract SaferPerps {
        uint256 public globalShortSize;
        uint256 public globalShortAveragePrice;
        uint256 private _lock = 1;
        modifier nonReentrant() { require(_lock == 1, "reentrant"); _lock = 2; _; _lock = 1; }
        function executeDecrease(address account, uint256 size) external nonReentrant {
            globalShortSize -= size;                    // finish accounting first
            // account callbacks, if any, happen after state is consistent and under the lock
        }
        function increaseShort(uint256 size, uint256 price) external nonReentrant {
            uint256 newSize = globalShortSize + size;
            globalShortAveragePrice = (globalShortAveragePrice * globalShortSize + price * size) / newSize;
            globalShortSize = newSize;
        }
    }
  explanation: 'A callback to a user-supplied contract is an external call like any other: finish the
    accounting first, and put one lock across every function that reads or writes the same global state.'

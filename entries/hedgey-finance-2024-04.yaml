root_cause: createLockedCampaign accepted a claimLockup parameter straight from the caller and the contract
  then used it when granting a token allowance. By choosing that value, the attacker had the contract
  approve USDC to an address they controlled, and then pulled the funds out with a normal transferFrom.
preconditions:
- contract_holds_user_funds
- approve_target_derived_from_caller_input
- no_validation_of_campaign_parameters
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Hedgey's source)
    pragma solidity ^0.8.20;
    interface IERC20 { function approve(address spender, uint256 amount) external returns (bool); }
    contract VulnerableCampaigns {
        // `locker` is supplied by the caller and ends up as the spender of an
        // allowance on tokens this contract holds.
        function createCampaign(address token, address locker, uint256 amount) external {
            IERC20(token).approve(locker, amount);
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Hedgey's source)
    pragma solidity ^0.8.20;
    interface IERC20 { function approve(address spender, uint256 amount) external returns (bool); }
    contract SaferCampaigns {
        address public immutable LOCKER;
        constructor(address locker) { LOCKER = locker; }
        function createCampaign(address token, uint256 amount) external {
            IERC20(token).approve(LOCKER, amount);   // spender fixed at deployment
        }
    }
  explanation: Allowances granted by a contract must go to fixed or allowlisted spenders, never to an
    address that flows in from a caller-controlled struct.

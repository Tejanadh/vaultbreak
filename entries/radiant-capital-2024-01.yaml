root_cause: A native USDC market on Arbitrum was listed with an empty reserve. The project's postmortem
  says the attacker used a flash loan, in the same minute as that listing, to move liquidityIndex
  because the reserve had no deposits yet, then borrowed about 1900 WETH. Secondary write-ups also
  point at rounding in the burn path. The flash loan is how the size was funded. The break is the
  empty reserve plus index math that a donation can push.

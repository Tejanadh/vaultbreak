  false_positive_fixture: fixtures/VB-2024-0018/fixed.sol
  notes: >-
    Syntactic only. It flags a rate function that divides the contract's own token balance by a
    share supply. It does not understand Aave liquidityIndex, seeding, or rounding direction.
    A raw balanceOf that is not used as the rate (see idleBalance in the fixed fixture) is silent.

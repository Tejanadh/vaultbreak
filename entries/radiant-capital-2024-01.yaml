code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Radiant or Aave source)
    pragma solidity ^0.8.20;
    interface IERC20 { function balanceOf(address) external view returns (uint256); }
    contract VulnerableIndex {
        IERC20 public underlying;
        uint256 public totalShares;
        function exchangeRate() public view returns (uint256) {
            if (totalShares == 0) return 1e18;
            return underlying.balanceOf(address(this)) * 1e18 / totalShares;
        }
        function priceOfShare() public view returns (uint256) {
            return underlying.balanceOf(address(this)) * 1e18 / totalShares;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Radiant or Aave source)
    pragma solidity ^0.8.20;
    interface IERC20 { function balanceOf(address) external view returns (uint256); }
    contract SaferIndex {
        IERC20 public underlying;
        uint256 public totalShares;
        uint256 public trackedCash;
        function exchangeRate() public view returns (uint256) {
            if (totalShares == 0) return 1e18;
            return trackedCash * 1e18 / totalShares;
        }
        function idleBalance() public view returns (uint256) {
            return underlying.balanceOf(address(this));
        }
    }
  explanation: 'Do not price shares from the raw token balance. Track cash internally, and do not
    list a market until it holds a seeded deposit that an attacker cannot be the sole supplier of.'
detectors:
- engine: semgrep

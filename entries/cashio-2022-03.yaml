code_pattern:
  language: rust
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Cashio source)
    fn print_cash(bank: &AccountInfo, collateral_mint: &Pubkey) {
        let bank_mint = Pubkey::new_from_array(bank.data.borrow()[0..32].try_into().unwrap());
        assert_eq!(bank_mint, *collateral_mint, "mint mismatch");
    }
  fixed_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Cashio source)
    fn print_cash(bank: &AccountInfo, collateral_mint: &Pubkey, expected_bank: &Pubkey) {
        assert_eq!(bank.key, expected_bank, "unexpected bank");
        let bank_mint = Pubkey::new_from_array(bank.data.borrow()[0..32].try_into().unwrap());
        assert_eq!(bank_mint, *collateral_mint, "mint mismatch");
    }
  explanation: A check that two caller-supplied accounts match each other does not make either one
    the protocol's account. Pin at least one account to a known address or PDA.

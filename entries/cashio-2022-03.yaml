root_cause: Cashio's mint path checked that caller-supplied accounts agreed with each other. It did
  not pin the bank account, or the mint field inside the arrow account, to a protocol-owned root.
  A caller built a matching set of fake accounts, deposited worthless collateral, and minted real CASH.

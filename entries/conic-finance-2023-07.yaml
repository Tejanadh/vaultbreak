root_cause: A newly written Curve LP-token oracle reintroduced a read-only reentrancy that was already
  a known hazard for Curve pools paying out ETH. A guard was meant to block it, but it was bypassed because
  ETH and WETH are identified by different addresses and the check only recognised one of them.
preconditions:
- lp_price_read_from_curve_view
- pool_pays_native_eth
- guard_keyed_on_wrong_asset_address
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Conic's source)
    pragma solidity ^0.8.20;
    contract VulnerableGuardCheck {
        address public constant WETH = 0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2;
        // Decides whether a pool needs the reentrancy check. Curve ETH pools list
        // the 0xEeee... sentinel, not WETH, so the check is silently skipped.
        function needsReentrancyCheck(address[] memory coins) public pure returns (bool) {
            for (uint256 i = 0; i < coins.length; i++) {
                if (coins[i] == WETH) return true;
            }
            return false;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Conic's source)
    pragma solidity ^0.8.20;
    contract SaferGuardCheck {
        address public constant WETH = 0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2;
        address public constant ETH_SENTINEL = 0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE;
        function needsReentrancyCheck(address[] memory coins) public pure returns (bool) {
            for (uint256 i = 0; i < coins.length; i++) {
                if (coins[i] == WETH || coins[i] == ETH_SENTINEL) return true;
            }
            return false;
        }
    }
  explanation: The mismatch is illustrated with a minimal guard-selection helper; Conic's real guard logic
    differs. Treat every alias of the native asset (zero address, sentinel, WETH) when deciding whether
    a pool can call back.

code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code; the real swap engine is far more involved)
    pragma solidity ^0.8.20;
    contract VulnerableTickPool {
        uint128 public liquidity;
        int24 public tick;
        mapping(int24 => int128) public liquidityNet;
        function _cross(int24 t) internal { liquidity = uint128(int128(liquidity) + liquidityNet[t]); }
        function _tickFromPrice(uint160 price) internal pure returns (int24) { return int24(int256(uint256(price >> 80))); }
        function swapStep(uint160 target, int24 boundaryTick, uint160 boundaryPrice) external {
            // Path A: the price reached the boundary, so cross it.
            if (target >= boundaryPrice) _cross(boundaryTick);
            // Path B: the tick is re-derived from the rounded price and may cross the same boundary again.
            int24 newTick = _tickFromPrice(target);
            if (newTick >= boundaryTick && tick < boundaryTick) _cross(boundaryTick);
            tick = newTick;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code; the real swap engine is far more involved)
    pragma solidity ^0.8.20;
    contract SaferTickPool {
        uint128 public liquidity;
        int24 public tick;
        mapping(int24 => int128) public liquidityNet;
        function _cross(int24 t) internal { liquidity = uint128(int128(liquidity) + liquidityNet[t]); }
        function _tickFromPrice(uint160 price) internal pure returns (int24) { return int24(int256(uint256(price >> 80))); }
        function swapStep(uint160 target, int24 boundaryTick, uint160 boundaryPrice) external {
            int24 newTick = _tickFromPrice(target);
            // One authority decides crossings: compare the tick before and after, exactly once.
            if (tick < boundaryTick && (newTick >= boundaryTick || target >= boundaryPrice)) _cross(boundaryTick);
            tick = newTick;
        }
    }
  explanation: A boundary must be crossed exactly once per swap. Two independent code paths (price comparison
    and tick re-derivation) that can both fire are the structural bug; the fix is a single decision point
    plus invariant tests at tick edges.

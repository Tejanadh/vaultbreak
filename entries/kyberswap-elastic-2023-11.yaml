root_cause: The attacker used a flash loan to push the pool price into a range with no liquidity, then
  executed carefully sized swaps so the price sat at a tick boundary under rounding. A precision error
  in how the swap logic handled that boundary made the pool count the same liquidity twice, which let
  the attacker withdraw far more than they had contributed.

code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Balancer's source)
    pragma solidity ^0.8.20;
    contract VulnerableStablePool {
        // scalingFactor is an 18-decimal fixed-point rate (1e18 means 1:1).
        function _upscale(uint256 amount, uint256 scalingFactor) internal pure returns (uint256) {
            return amount * scalingFactor / 1e18;          // floors
        }
        // Exact-out: the amount the trader receives is upscaled with a flooring helper,
        // so the amountIn derived from it is slightly too small. Repeat it many times.
        function quoteExactOut(uint256 amountOut, uint256 scaleOut, uint256 priceInPerOut) external pure returns (uint256 amountIn) {
            uint256 scaledOut = _upscale(amountOut, scaleOut);
            amountIn = scaledOut * priceInPerOut / 1e18;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Balancer's source)
    pragma solidity ^0.8.20;
    contract SaferStablePool {
        function _upscaleUp(uint256 amount, uint256 scalingFactor) internal pure returns (uint256) {
            return (amount * scalingFactor + 1e18 - 1) / 1e18;   // ceil, favours the pool
        }
        function quoteExactOut(uint256 amountOut, uint256 scaleOut, uint256 priceInPerOut) external pure returns (uint256 amountIn) {
            uint256 scaledOut = _upscaleUp(amountOut, scaleOut);
            amountIn = (scaledOut * priceInPerOut + 1e18 - 1) / 1e18;
        }
    }
  explanation: Rounding must favour the pool at every step of both swap directions. Invariant fuzzing
    that chains many tiny swaps with non-unit rate providers is the test that exposes it.

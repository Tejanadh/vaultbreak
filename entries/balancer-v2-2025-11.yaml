root_cause: In the exact-amount-out swap path the pool scaled the output amount up using a rounding step
  that rounded down, so the computed input amount came out slightly too low. With a rate provider whose
  scaling was not 1:1, and many tiny swaps chained in a batch while the pool was in a low-liquidity state,
  the repeated tiny undercharges added up and suppressed the pool-token price.

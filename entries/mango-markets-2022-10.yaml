code_pattern:
  language: rust
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Mango source)
    fn collateral_value(spot_price: u64, position: i64) -> u64 {
        spot_price * position.unsigned_abs()
    }
  fixed_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Mango source)
    fn collateral_value(oracle_price: u64, spot_price: u64, position: i64) -> u64 {
        let mark = oracle_price.min(spot_price);
        mark * position.unsigned_abs()
    }
  explanation: A perp mark that reads the same spot pool the trader is buying does not bound the
    position. The illustration uses a second price as a cap. It is not Mango's production oracle.

root_cause: Two accounts took opposite MNGO perpetual positions, then bought MNGO on thin spot venues
  that fed the price Mango used. Sec3 records the long from 0.0382 to about 0.5 USDC. The long was
  settled against the short, and the winning account borrowed the pool's liquid assets. The trades
  followed the program's own rules. The break was marking a large perp to a spot price the trader could move.

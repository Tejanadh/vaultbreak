code_pattern:
  language: rust
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Nirvana source)
    fn sell(treasury_usdc: &mut u64, ana_price: u64, ana_in: u64) {
        *treasury_usdc -= ana_price * ana_in;
    }
  fixed_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Nirvana source)
    fn sell(treasury_usdc: &mut u64, independent_price: u64, ana_in: u64, cap: u64) {
        let pay = independent_price.saturating_mul(ana_in).min(cap);
        *treasury_usdc = treasury_usdc.saturating_sub(pay);
    }
  explanation: A price that the same trade just wrote is not an independent quote. The payout
    has to be bounded by reserves and by a price the trader cannot set inside the transaction.

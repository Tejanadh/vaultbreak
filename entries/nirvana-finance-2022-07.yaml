root_cause: A flash loan from Solend funded a buy of ANA that moved the price Nirvana used. The same
  position was then sold into the treasury for more stablecoins than the loan, and the loan was repaid.
  The Block describes this as a manipulated oracle feed. CertiK describes a Buy command that moved ANA
  from about $8 to about $24. Both are recorded. The entry does not pick a winner.

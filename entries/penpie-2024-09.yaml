code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Penpie's source)
    pragma solidity ^0.8.20;
    interface IMarket { function redeemRewards(address user) external; }
    interface IToken { function balanceOf(address) external view returns (uint256); }
    contract VulnerableHarvester {
        IToken public reward;
        mapping(address => uint256) public accrued;
        mapping(address => bool) public registered;
        function register(address market) external { registered[market] = true; }  // permissionless
        // Balance-delta accounting around a call into an untrusted market:
        // a reentrant harvest inside redeemRewards double counts the same tokens.
        function harvest(address market) external {
            require(registered[market], "unknown market");
            uint256 before = reward.balanceOf(address(this));
            IMarket(market).redeemRewards(address(this));
            accrued[market] += reward.balanceOf(address(this)) - before;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Penpie's source)
    pragma solidity ^0.8.20;
    interface IMarket { function redeemRewards(address user) external; }
    interface IToken { function balanceOf(address) external view returns (uint256); }
    contract SaferHarvester {
        IToken public reward;
        address public admin;
        uint256 private _lock = 1;
        mapping(address => uint256) public accrued;
        mapping(address => bool) public approvedMarket;
        modifier nonReentrant() { require(_lock == 1, "reentrant"); _lock = 2; _; _lock = 1; }
        function approve(address market) external { require(msg.sender == admin, "admin only"); approvedMarket[market] = true; }
        function harvest(address market) external nonReentrant {
            require(approvedMarket[market], "market not approved");
            uint256 before = reward.balanceOf(address(this));
            IMarket(market).redeemRewards(address(this));
            accrued[market] += reward.balanceOf(address(this)) - before;
        }
    }
  explanation: 'Two fixes work together: only call markets an admin has vetted, and put a mutex on every
    function that makes an external call before finishing its accounting.'

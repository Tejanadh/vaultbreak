root_cause: Anyone could register a Pendle market with the protocol, so the attacker registered a fake
  one they controlled. When the protocol harvested rewards it called into that market, which re-entered
  the harvest function before the first call had finished accounting. The nested call inflated the attacker's
  staking balance, which they then redeemed for real funds.
preconditions:
- permissionless_market_registration
- harvest_calls_external_untrusted_contract
- no_reentrancy_guard_on_harvest

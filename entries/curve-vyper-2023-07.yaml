tags:
- compiler_bug
- vyper_nonreentrant_lock
- native_eth_callback
root_cause: Affected Vyper releases (0.2.15, 0.2.16, 0.3.0) laid out the storage slot for the non-reentrant
  lock inconsistently between add_liquidity and remove_liquidity. Contracts that looked correctly guarded
  in source therefore did not share one lock at runtime, and a callback during the ETH payout could re-enter
  the other function.
preconditions:
- compiled_with_affected_vyper_version
- pool_pays_native_eth_with_callback
- lock_name_shared_across_functions
affected_contracts: []
attack_txs: []
code_pattern:
  language: vyper
  illustrative: true
  vulnerable_snippet: |
    # ILLUSTRATIVE (our own minimal Vyper, not Curve's source)
    # The source looks safe: both entry points use the SAME named lock.
    # The defect was in the compiler's generated slot layout, so nothing in this
    # text reveals it. Only the compiler version (and the emitted storage layout) does.
    @external
    @nonreentrant('lock')
    def add_liquidity(amounts: uint256[2], min_mint: uint256) -> uint256:
        return 0

    @external
    @nonreentrant('lock')
    def remove_liquidity(amount: uint256, min_amounts: uint256[2]) -> uint256[2]:
        return [0, 0]
  fixed_snippet: |
    # ILLUSTRATIVE (our own minimal Vyper, not Curve's source)
    # Source is unchanged. The fix is operational: compile with a Vyper release that
    # does not have the lock-slot defect, then diff the emitted storage layout so the
    # lock occupies one slot for every guarded function.
    @external
    @nonreentrant('lock')
    def add_liquidity(amounts: uint256[2], min_mint: uint256) -> uint256:
        return 0
  explanation: 'This is a toolchain failure, not a source pattern, so no Semgrep or Slither detector is
    offered for it. The useful check is a build-time one: pin and audit compiler versions, and verify
    storage layout of guard variables.'

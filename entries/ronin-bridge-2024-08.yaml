root_cause: The bridge was upgraded from version 2 to version 4 by calling only the version-4 initializer
  and skipping the version-3 one. A total-operator-weight value that version 3 was supposed to set therefore
  stayed at zero, which made the minimum vote weight required to approve a withdrawal zero as well.
preconditions:
- multi_step_initializer_chain
- upgrade_skipped_a_version
- threshold_derived_from_uninitialized_state
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Ronin's source)
    pragma solidity ^0.8.20;
    contract VulnerableBridgeV4 {
        uint8 public initializedVersion;
        uint256 public totalOperatorWeight;      // set only by initializeV3
        function initializeV3(uint256 weight) external {
            require(initializedVersion < 3, "done");
            totalOperatorWeight = weight;
            initializedVersion = 3;
        }
        function initializeV4() external {
            require(initializedVersion < 4, "done");   // happily runs even if V3 never did
            initializedVersion = 4;
        }
        function minimumVoteWeight() public view returns (uint256) {
            return totalOperatorWeight * 7 / 10;       // 0 when V3 was skipped
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Ronin's source)
    pragma solidity ^0.8.20;
    contract SaferBridgeV4 {
        uint8 public initializedVersion;
        uint256 public totalOperatorWeight;
        function initializeV3(uint256 weight) external {
            require(initializedVersion == 2, "wrong order");
            totalOperatorWeight = weight;
            initializedVersion = 3;
        }
        function initializeV4() external {
            require(initializedVersion == 3, "V3 not initialised");   // strict sequence
            require(totalOperatorWeight > 0, "weight unset");          // invariant at the end of init
            initializedVersion = 4;
        }
        function minimumVoteWeight() public view returns (uint256) {
            uint256 w = totalOperatorWeight * 7 / 10;
            require(w > 0, "zero threshold");
            return w;
        }
    }
  explanation: Enforce initializer order and assert non-zero security parameters both at init time and
    where they are consumed, so a skipped step fails loudly.
fix:
  summary: Enforce strict reinitializer sequencing and assert non-zero thresholds after every upgrade.

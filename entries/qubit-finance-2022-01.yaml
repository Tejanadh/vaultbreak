code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Qubit's source)
    pragma solidity ^0.8.20;
    contract VulnerableBridge {
        event Deposit(address indexed token, address indexed from, uint256 amount);
        function _pull(address token, address from, uint256 amount) internal {
            // A low-level call to an address with no code returns ok == true.
            (bool ok, ) = token.call(abi.encodeWithSignature(
                "transferFrom(address,address,uint256)", from, address(this), amount));
            require(ok, "pull failed");
        }
        // Legacy entry point left in place; token == address(0) sails through.
        function deposit(address token, uint256 amount) external {
            _pull(token, msg.sender, amount);
            emit Deposit(token, msg.sender, amount);
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Qubit's source)
    pragma solidity ^0.8.20;
    contract SaferBridge {
        mapping(address => bool) public supportedToken;
        event Deposit(address indexed token, address indexed from, uint256 amount);
        function deposit(address token, uint256 amount) external {
            require(supportedToken[token] && token.code.length > 0, "unsupported token");
            (bool ok, bytes memory ret) = token.call(abi.encodeWithSignature(
                "transferFrom(address,address,uint256)", msg.sender, address(this), amount));
            require(ok && (ret.length == 0 || abi.decode(ret, (bool))), "pull failed");
            emit Deposit(token, msg.sender, amount);
        }
    }
  explanation: 'Two gaps stack: no check that the token is a real, supported contract, and a token pull
    whose success is never confirmed by a balance change. Retire superseded entry points rather than leaving
    them live.'

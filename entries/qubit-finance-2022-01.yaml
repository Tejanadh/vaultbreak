root_cause: The bridge kept an older deposit() entry point alive after a newer depositETH() was added.
  Called with the zero address as the token, its token pull went to an address with no code, and that
  pull did not revert, so the bridge still emitted a deposit event. The BSC side then minted qXETH although
  no ETH had been locked on Ethereum.
preconditions:
- legacy_entrypoint_still_callable
- token_pull_does_not_check_for_code
- mint_trusts_deposit_event

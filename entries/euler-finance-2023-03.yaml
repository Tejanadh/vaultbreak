root_cause: The donateToReserves function reduced a user's collateral without re-checking that the user's
  account was still healthy afterwards. The attacker used that to push their own position underwater on
  purpose, then liquidated it from a second contract at the liquidation discount, extracting more value
  than they had put in.
preconditions:
- state_changing_function_without_post_condition_check
- liquidation_discount_exploitable
- flash_loan_liquidity_available
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Euler's source)
    pragma solidity ^0.8.20;
    contract VulnerableLending {
        mapping(address => uint256) public collateral;
        mapping(address => uint256) public debt;
        uint256 public reserves;
        function isHealthy(address a) public view returns (bool) { return collateral[a] >= debt[a] * 2; }
        // Moves collateral into reserves. Nothing re-checks the donor afterwards,
        // so the caller can create a position that is instantly liquidatable.
        function donateToReserves(uint256 amount) external {
            collateral[msg.sender] -= amount;
            reserves += amount;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Euler's source)
    pragma solidity ^0.8.20;
    contract SaferLending {
        mapping(address => uint256) public collateral;
        mapping(address => uint256) public debt;
        uint256 public reserves;
        function isHealthy(address a) public view returns (bool) { return collateral[a] >= debt[a] * 2; }
        function donateToReserves(uint256 amount) external {
            collateral[msg.sender] -= amount;
            reserves += amount;
            require(isHealthy(msg.sender), "donor unhealthy");   // same post-condition as withdraw/borrow
        }
    }
  explanation: Every function that can reduce a user's collateral or raise their debt must end with the
    same solvency invariant. Auditing for 'which entry points forgot the health check' finds this class.

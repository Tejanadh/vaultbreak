root_cause: The signers were tricked into approving a Safe transaction whose operation type was delegatecall
  and whose target was an attacker contract. That contract's code ran in the wallet's own storage context
  and overwrote slot 0, where the proxy keeps its implementation address, swapping in a malicious implementation
  that then moved the funds. The weakness was the signing process and interface, not a flaw in the Safe
  code itself.

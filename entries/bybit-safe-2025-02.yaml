code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Safe's source)
    pragma solidity ^0.8.20;
    contract VulnerableWallet {
        address public implementation;     // slot 0, same slot any delegatecalled code can overwrite
        address public owner;
        function execute(address to, uint256 value, bytes calldata data, uint8 operation) external {
            require(msg.sender == owner, "not owner");
            if (operation == 1) {
                (bool ok, ) = to.delegatecall(data);   // caller-chosen target runs in OUR storage
                require(ok, "delegatecall failed");
            } else {
                (bool ok, ) = to.call{value: value}(data);
                require(ok, "call failed");
            }
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Safe's source)
    pragma solidity ^0.8.20;
    contract SaferWallet {
        address public owner;
        mapping(address => bool) public approvedModule;
        function execute(address to, uint256 value, bytes calldata data) external {
            require(msg.sender == owner, "not owner");
            (bool ok, ) = to.call{value: value}(data);   // plain calls only
            require(ok, "call failed");
        }
        function execModule(address module, bytes calldata data) external {
            require(msg.sender == owner, "not owner");
            require(approvedModule[module], "module not approved");   // delegatecall only to vetted code
            (bool ok, ) = module.delegatecall(data);
            require(ok, "module call failed");
        }
    }
  explanation: 'The shape: a wallet entry point where the delegatecall target is a parameter. Safe''s
    delegatecall operation is a documented feature, so the real-world fix is process-level (verify what
    you sign, independent transaction simulation, guards that block delegatecall), not only code-level.'

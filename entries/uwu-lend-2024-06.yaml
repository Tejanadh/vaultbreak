root_cause: The sUSDe price was the median of eleven sources, but five of them were instantaneous prices
  read from Curve pools. A median only resists manipulation if a majority of inputs are hard to move,
  and here flash-loaned trades in the Curve pools could shift enough inputs at once to move the median
  itself.

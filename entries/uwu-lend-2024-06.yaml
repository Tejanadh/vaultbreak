code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not UwU's source)
    pragma solidity ^0.8.20;
    interface IFeed { function read() external view returns (uint256); }
    contract VulnerableMedianOracle {
        IFeed[] public feeds;                  // some feeds are spot prices from AMM pools
        function price() external view returns (uint256) {
            uint256 n = feeds.length;
            uint256[] memory p = new uint256[](n);
            for (uint256 i = 0; i < n; i++) p[i] = feeds[i].read();
            for (uint256 i = 1; i < n; i++)    // insertion sort, then take the middle
                for (uint256 j = i; j > 0 && p[j - 1] > p[j]; j--) (p[j - 1], p[j]) = (p[j], p[j - 1]);
            return p[n / 2];
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not UwU's source)
    pragma solidity ^0.8.20;
    interface IFeed { function read() external view returns (uint256); }
    contract SaferMedianOracle {
        struct Feed { IFeed feed; bool manipulationResistant; }   // push oracle or long TWAP
        Feed[] public feeds;
        function price() external view returns (uint256) {
            uint256 n = feeds.length;
            uint256[] memory p = new uint256[](n);
            uint256 resistant;
            for (uint256 i = 0; i < n; i++) {
                p[i] = feeds[i].feed.read();
                if (feeds[i].manipulationResistant) resistant++;
            }
            require(resistant * 2 > n, "majority must resist manipulation");
            for (uint256 i = 1; i < n; i++)
                for (uint256 j = i; j > 0 && p[j - 1] > p[j]; j--) (p[j - 1], p[j]) = (p[j], p[j - 1]);
            return p[n / 2];
        }
    }
  explanation: Count the manipulation-resistant inputs, not just the inputs. Spot AMM prices are cheap
    to move inside one transaction; a median is only as strong as its majority.

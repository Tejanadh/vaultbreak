root_cause: Crema's fee math trusted data in a tick account. The project said the attacker created a
  fake tick account and wrote an initialized tick address into it, which got past the usual owner check.
  Flash-loan liquidity was deposited, a claim used the fake fee data, and the liquidity was withdrawn.

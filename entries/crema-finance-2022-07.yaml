- chain: solana
  hash: 5kfoGgEvhBiHXz1MBVxn8rfJh3cf98m3D64YHE2Q1SsXLiaahvdK4hCJfkMA7jQFXLjP9YdNSTMSor3oXbKrLTev
code_pattern:
  language: rust
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Crema source)
    fn claim_fee(tick: &AccountInfo) -> u64 {
        u64::from_le_bytes(tick.data.borrow()[0..8].try_into().unwrap())
    }
  fixed_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Crema source)
    fn claim_fee(tick: &AccountInfo, pool: &Pubkey, program_id: &Pubkey) -> u64 {
        let (expected, _) = Pubkey::find_program_address(&[b"tick", pool.as_ref()], program_id);
        assert_eq!(tick.key, &expected, "unexpected tick");
        assert_eq!(tick.owner, program_id, "unexpected owner");
        u64::from_le_bytes(tick.data.borrow()[0..8].try_into().unwrap())
    }
  explanation: Fee inputs have to be the pool's own tick account. An owner check that can be
    satisfied by data written into a fake account is not a binding to that pool.

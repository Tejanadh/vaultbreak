code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Sonne's source)
    pragma solidity ^0.8.20;
    contract VulnerableTimelock {
        struct Op { address target; bytes data; uint256 eta; bool done; }
        mapping(uint256 => Op) public ops;
        // Anyone may execute once eta passes, and 'list market' is a standalone op,
        // so the empty market exists in the same tx as the caller's exploit.
        function execute(uint256 id) external {
            Op storage o = ops[id];
            require(block.timestamp >= o.eta && !o.done, "not ready");
            o.done = true;
            (bool ok, ) = o.target.call(o.data);
            require(ok, "failed");
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Sonne's source)
    pragma solidity ^0.8.20;
    contract SaferTimelock {
        struct Op { address[] targets; bytes[] datas; uint256 eta; bool done; }
        mapping(uint256 => Op) public ops;
        address public executor;
        // Listing and seeding are ONE batched op (list market, then mint dead shares),
        // and only a trusted executor may trigger it.
        function executeBatch(uint256 id) external {
            require(msg.sender == executor, "not executor");
            Op storage o = ops[id];
            require(block.timestamp >= o.eta && !o.done, "not ready");
            o.done = true;
            for (uint256 i = 0; i < o.targets.length; i++) {
                (bool ok, ) = o.targets[i].call(o.datas[i]);
                require(ok, "failed");
            }
        }
    }
  explanation: 'Two independent controls would each have helped: make the activation atomic with seeding,
    and do not let arbitrary callers choose the moment an unsafe state becomes live.'

root_cause: A governance action that listed a new VELO market became executable by anyone once its timelock
  expired, and it did not seed the market with liquidity. The attacker executed the queued proposal themselves
  and, in the same transaction, exploited the brand-new empty market using the usual donation and rounding
  trick on a Compound-style exchange rate.
preconditions:
- permissionless_timelock_execute
- market_listed_without_seed_liquidity
- compound_v2_exchange_rate_logic

root_cause: Balancer pays out ETH from exitPool with a call while its internal accounting is only half
  updated. The receiver re-entered Sentiment, whose LP-token oracle priced collateral from Balancer view
  functions (pool balances and total supply) that had no reentrancy protection and therefore returned
  inconsistent values. Collateral was valued at more than 16 times its true worth.

code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Sentiment's source)
    pragma solidity ^0.8.20;
    interface IVault { function getPoolTokens(bytes32 id) external view returns (address[] memory, uint256[] memory, uint256); }
    interface ILp { function totalSupply() external view returns (uint256); }
    contract VulnerableLpOracle {
        IVault public immutable VAULT; bytes32 public immutable POOL_ID; address public immutable LP;
        constructor(IVault v, bytes32 id, address lp) { VAULT = v; POOL_ID = id; LP = lp; }
        // View-only: if called from inside the pool's ETH-payout callback, balances
        // and totalSupply are momentarily inconsistent and the price is inflated.
        function getPrice() external view returns (uint256) {
            (, uint256[] memory bal, ) = VAULT.getPoolTokens(POOL_ID);
            uint256 total;
            for (uint256 i = 0; i < bal.length; i++) total += bal[i];
            return total * 1e18 / ILp(LP).totalSupply();
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not Sentiment's source)
    pragma solidity ^0.8.20;
    interface IVault {
        function getPoolTokens(bytes32 id) external view returns (address[] memory, uint256[] memory, uint256);
        function manageUserBalance(bytes[] memory ops) external payable;
    }
    interface ILp { function totalSupply() external view returns (uint256); }
    contract SaferLpOracle {
        IVault public immutable VAULT; bytes32 public immutable POOL_ID; address public immutable LP;
        constructor(IVault v, bytes32 id, address lp) { VAULT = v; POOL_ID = id; LP = lp; }
        // State-mutating on purpose: a no-op Vault call reverts if the Vault's own guard is engaged.
        function getPrice() external returns (uint256) {
            VAULT.manageUserBalance(new bytes[](0));
            (, uint256[] memory bal, ) = VAULT.getPoolTokens(POOL_ID);
            uint256 total;
            for (uint256 i = 0; i < bal.length; i++) total += bal[i];
            return total * 1e18 / ILp(LP).totalSupply();
        }
    }
  explanation: 'Fix mirrors the approach described in Sentiment''s postmortem: make the price read touch
    the Vault so its reentrancy guard engages. Note the fixed version is not `view`, which callers must
    accommodate.'

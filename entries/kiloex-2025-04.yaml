root_cause: KiloEx's trusted forwarder was built on a stock meta-transaction forwarder whose relay function
  was left open, so anyone could submit a request through it. The keeper-gated functions behind it only
  checked that the caller was the forwarder and never checked who the original requester was. The attacker
  used that to set oracle prices, opened a leveraged position at a manipulated low price and closed it
  at a high one.
preconditions:
- relay_function_not_restricted
- downstream_auth_trusts_forwarder_address_only
- oracle_prices_settable_via_keeper_path
affected_contracts: []
attack_txs: []
code_pattern:
  language: solidity
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (our own minimal code, not KiloEx's source)
    pragma solidity ^0.8.20;
    contract OpenForwarder {
        // Stock-style relay left unrestricted: anyone can make any call "from" the forwarder.
        function execute(address to, bytes calldata data) external returns (bool ok) {
            (ok, ) = to.call(data);
        }
    }
    contract VulnerableKeeper {
        address public trustedForwarder;
        uint256 public price;
        function setPrice(uint256 p) external {
            require(msg.sender == trustedForwarder, "not forwarder");   // trusts the relay, not the originator
            price = p;
        }
    }
  fixed_snippet: |
    // ILLUSTRATIVE (our own minimal code, not KiloEx's source)
    pragma solidity ^0.8.20;
    contract SaferKeeper {
        address public trustedForwarder;
        mapping(address => bool) public isKeeper;
        uint256 public price;
        // ERC-2771 style: the forwarder appends the verified signer to calldata.
        function _originalSender() internal view returns (address s) {
            require(msg.sender == trustedForwarder && msg.data.length >= 20, "bad relay");
            assembly { s := shr(96, calldataload(sub(calldatasize(), 20))) }
        }
        function setPrice(uint256 p) external {
            require(isKeeper[_originalSender()], "not keeper");   // authorise the originator
            price = p;
        }
    }
  explanation: Trusting 'msg.sender == forwarder' is only sound if the forwarder itself authenticates
    the originator and the target then authorises that originator. Both halves are needed; override or
    restrict inherited relay functions.
poc: []
fix:
  summary: Restrict or override the inherited relay function and authorise the original requester, not
    just the forwarder address.

scope: code
vuln_class: unchecked_sysvar
tags:
- forged_signature
- unbacked_mint
- missing_input_validation
root_cause: Wormhole's Solana signature check read prior instruction data through a deprecated loader
  that did not prove the account was the canonical instructions sysvar. A caller could pass a
  normal account whose bytes looked like a successful secp256k1 verification. The bridge then
  treated a guardian signature set as verified and minted wrapped ETH with no matching lock on Ethereum.
preconditions:
- caller_supplied_sysvar_account
- deprecated_instruction_loader
affected_contracts:
- chain: solana
  address: worm2ZoG2kUd4vFXhvjh93UUH596ayRfgQ2MgjNMTth
  role: program invoked by the confirmed transaction
  verified_on_explorer: true
- chain: solana
  address: 2tHS1cXX2h1KBEaadprqELJ6sV9wLoaSdX68FqsrrZRd
  role: account key on that transaction; the DF3NDR write-up calls it the forged sysvar account
  verified_on_explorer: true
attack_txs:
- chain: solana
  hash: 25Zu1L2Q9uk998d5GMnX43t9u9eVBKvbVtgHndkc2GmUFed8Pu73LGW6hiDsmGXHykKUTLkvUdh4yXPdL3Jo4wVS
code_pattern:
  language: rust
  illustrative: true
  vulnerable_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Wormhole source)
    fn verify(accounts: &[AccountInfo]) {
        let supplied = &accounts[0];
        let data = supplied.data.borrow();
        assert!(data[0] == 1, "secp not verified");
    }
  fixed_snippet: |
    // ILLUSTRATIVE (minimal stand-in, not Wormhole source)
    use solana_program::sysvar::instructions;
    fn verify(accounts: &[AccountInfo]) {
        let supplied = &accounts[0];
        assert_eq!(supplied.key, &instructions::ID, "not the instructions sysvar");
        let data = supplied.data.borrow();
        assert!(data[0] == 1, "secp not verified");
    }
  explanation: Compare the account address with the canonical sysvar id before reading it.
    Checking a byte inside caller-controlled data does not prove a previous instruction ran.

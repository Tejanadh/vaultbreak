# Secondary tags, v1. Format: snake_case, or group:value for cross-cutting groups.
version: 1
tags:
  approval_abuse: {description: "Allowance or transferFrom abused to move funds"}
  arbitrary_contract_accepted: {description: "Protocol accepts a user-supplied contract where an EOA/trusted contract was assumed"}
  bad_initialization_after_upgrade: {description: "Upgrade left the new version initialised with unsafe values"}
  balance_delta_accounting: {description: "Accounting by balanceOf difference around an external call"}
  batch_swap_micro_swaps: {description: "Many tiny swaps chained in one batch to accumulate rounding error"}
  callback_reentrancy: {description: "Reentrancy through a token/hook/user callback"}
  caller_controlled_approval_target: {description: "Spender of an allowance derived from caller input"}
  caller_controlled_calldata: {description: "External call data built from caller input"}
  caller_controlled_token: {description: "Token address taken from caller input"}
  capital_amplifier:flash_loan: {description: "Flash loan used as capital amplifier (not a root cause)"}
  cei_violation: {description: "Checks-effects-interactions ordering violated"}
  compiler_bug: {description: "Defect in the compiler, not in the source"}
  compound_fork: {description: "Fork of Compound V2-style lending code"}
  compound_style_exchange_rate: {description: "Exchange rate derived from raw balance and total shares"}
  concentrated_liquidity: {description: "Tick-based concentrated liquidity AMM"}
  copycat_exploitation: {description: "Exploit tx trivially copyable by unrelated accounts"}
  cross_contract_reentrancy: {description: "Re-entry through a different contract sharing state"}
  donate_to_reserves: {description: "Donation function that moves collateral into reserves"}
  double_counted_liquidity: {description: "Same liquidity applied twice in swap maths"}
  emergency_proposal_path: {description: "Governance fast path with weaker safeguards"}
  empty_market: {description: "Market with zero or near-zero shares at exploit time"}
  eth_weth_address_mixup: {description: "Native ETH alias (sentinel/zero) confused with WETH"}
  exchange_rate_donation: {description: "Exchange rate moved by donating tokens to the contract"}
  forged_signature: {description: "Signature or sender identity accepted without proper verification"}
  forwarder_confusion: {description: "Trusting a forwarder address instead of the original sender"}
  governance_timing: {description: "Exploitable timing in governance/timelock execution"}
  incomplete_prior_fix: {description: "An earlier fix did not cover every entry point"}
  legacy_code: {description: "Superseded code path left live"}
  low_liquidity_state: {description: "Exploit requires pool in a low-liquidity state"}
  median_oracle_thin_inputs: {description: "Median over feeds where too many are manipulable"}

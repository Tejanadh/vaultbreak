  treasury_drain: {description: "Protocol treasury moved out"}
  unbacked_mint: {description: "Tokens minted without backing collateral"}
  unproven_message_accepted: {description: "Cross-chain message accepted without a valid proof"}
  unrestricted_relay_entrypoint: {description: "Relay/execute function callable by anyone"}
  untrusted_market_registration: {description: "Permissionless registration of an attacker-controlled market"}
  unverified_contracts: {description: "Contracts unverified on explorer, analysis from decompilation"}
  vyper_nonreentrant_lock: {description: "Vyper @nonreentrant lock behaviour"}
  zero_address_token: {description: "address(0) accepted as token"}

  self_liquidation: {description: "Attacker liquidates their own deliberately unhealthy position"}
  signer_phishing: {description: "Signers deceived into approving a malicious transaction"}
  skipped_upgrade_step: {description: "Upgrade path skipped a required step"}
  spot_price_input: {description: "Instantaneous AMM price used as an input"}
  stablecoin_collateral_pricing: {description: "Pricing of a yield-bearing stablecoin as collateral"}
  storage_slot_overwrite: {description: "Specific storage slot overwritten via delegatecall"}

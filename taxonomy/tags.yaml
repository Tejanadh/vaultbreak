  missing_health_check: {description: "State change without post-condition solvency check"}
  missing_input_validation: {description: "Caller-supplied parameters not validated"}
  missing_reinitializer: {description: "Reinitializer step missing or skipped"}
  multisig_wallet: {description: "Multisig / Safe-style wallet involved"}
  native_eth_callback: {description: "Native ETH payout gives the receiver control flow"}
  no_execution_delay: {description: "Passed action executes with no delay"}
  oracle_lp_pricing: {description: "LP token priced from pool state"}
  oracle_price_set_by_attacker: {description: "Attacker can write the price used by the protocol"}
  price_accounting_manipulation: {description: "Global price accounting variable manipulated"}
  proxy_implementation_swap: {description: "Proxy implementation replaced by attacker"}
  rate_provider_scaling: {description: "Non-unit rate provider scaling in stable pools"}
  read_only_reentrancy: {description: "Reentrancy that only reads inconsistent view state"}
  redeem_rounding: {description: "Rounding in redeem/withdraw benefits the redeemer"}
  reintroduced_known_bug: {description: "Known bug reappeared in new code"}
  reward_inflation: {description: "Reward or staking balance inflated"}

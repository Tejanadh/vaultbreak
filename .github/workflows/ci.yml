name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: also re-checks every source link

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: pip install -r requirements.txt

      - name: Install solc 0.8.20
        run: |
          solc-select install 0.8.20
          solc-select use 0.8.20
          solc --version

      - name: Validate entries (schema, taxonomy, sources, TODO ban)
        run: python scripts/validate.py

      - name: Validator negative tests
        run: python -m unittest discover -s tests -v

      - name: Compile every snippet and fixture
        run: python scripts/compile_snippets.py

      - name: Detector tests (fires on vulnerable, silent on fixed)
        run: python scripts/test_detectors.py

      - name: Build JSON, SQLite and static site
        run: python scripts/build.py

      - name: Site filter tests
        run: node tests/site_filter.test.js

      - name: Upload site artefact
        uses: actions/upload-artifact@v4
        with:
          name: vaultbreak-site
          path: build/

  link-check:
    # Network-dependent, so it never blocks a push; it runs on the weekly schedule and on demand.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3 jsonschema==4.25.1
      - run: python scripts/validate.py --check-links --quiet
